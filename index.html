<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Veltrix | AI Multilingual Support Platform</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✳️</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #f1f5f2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #111827;
      overflow: hidden;
    }
    #root {
      width: 100%;
      height: 100%;
    }
    #veltrix-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #f1f5f2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.4s ease;
    }
    .loader-card {
      background: #ffffff;
      border: 1px solid #e2ebe3;
      border-radius: 20px;
      padding: 36px 42px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      text-align: center;
      max-width: 480px;
      width: 90%;
    }
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #dcfce7;
      border: 1px solid #86efac;
      border-radius: 9999px;
      padding: 4px 16px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #15803d;
      margin-bottom: 14px;
    }
    .brand-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: #111827;
      letter-spacing: -0.03em;
    }
    .brand-sub {
      font-size: 0.90rem;
      color: #64748b;
      margin-top: 6px;
      margin-bottom: 24px;
      line-height: 1.45;
    }
    .spinner-ring {
      width: 44px;
      height: 44px;
      border: 4px solid #e2ebe3;
      border-top-color: #16a34a;
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      font-size: 0.85rem;
      color: #15803d;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="veltrix-loader">
    <div class="loader-card">
      <div class="brand-badge"><span>✳️</span> VELTRIX AI SUPPORT STUDIO</div>
      <div class="brand-title">Launching Platform</div>
      <div class="brand-sub">Compiling Indic Code-Mixed Triage & 3D Workstation Forge inside WebAssembly...</div>
      <div class="spinner-ring"></div>
      <div id="status-msg" class="status-text">Booting Pyodide runtime...</div>
    </div>
  </div>

  <div id="root"></div>

  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";

    const statusEl = document.getElementById("status-msg");
    const loaderEl = document.getElementById("veltrix-loader");

    async function loadApp() {
      try {
        if (statusEl) statusEl.innerText = "Fetching Python triage modules...";
        const fileNames = [
          "app.py",
          "ai_engine.py",
          "database.py",
          "forge_3d.py",
          "evaluate.py",
          "test_cases.py"
        ];

        const files = {};
        await Promise.all(
          fileNames.map(async (name) => {
            const resp = await fetch(`./${name}`);
            if (!resp.ok) {
              throw new Error(`Failed to load ${name}: ${resp.statusText}`);
            }
            files[name] = await resp.text();
          })
        );

        if (statusEl) statusEl.innerText = "Mounting Streamlit & Three.js 3D Forge...";

        mount(
          {
            requirements: ["pandas"],
            entrypoint: "app.py",
            files: files
          },
          document.getElementById("root")
        );

        // Hide loader once mounted
        setTimeout(() => {
          if (loaderEl) {
            loaderEl.style.opacity = "0";
            setTimeout(() => {
              loaderEl.style.display = "none";
            }, 400);
          }
        }, 1500);
      } catch (err) {
        console.error("Veltrix load error:", err);
        if (statusEl) {
          statusEl.innerText = "Error launching WebAssembly environment: " + err.message;
          statusEl.style.color = "#dc2626";
        }
      }
    }

    loadApp();
  </script>
</body>
</html>
